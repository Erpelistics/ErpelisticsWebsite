{{ with site.Menus.main }}
  <menu class="hidden" id="menu">
    {{ range . }}
      <li itemscope itemtype="http://www.schema.org/SiteNavigationElement">
        <a aria-current="{{ or (page.IsMenuCurrent .Menu .) (page.HasMenuCurrent .Menu .) }}" href="{{ .URL }}" itemprop="url">
          <span itemprop="name">{{ .Name }}</span>
        </a>
      </li>
    {{ end }}
    {{ if page.Translations }}
      <li class="lang-switcher-item">
        <div class="lang-switcher">
          {{ range page.AllTranslations }}
            {{ if eq .Lang $.Site.Language.Lang }}
              <span class="lang-current">{{ .Lang | upper }}</span>
            {{ else }}
              <a class="lang-link" href="{{ .Permalink }}">{{ .Lang | upper }}</a>
            {{ end }}
          {{ end }}
        </div>
      </li>
    {{ end }}
  </menu>
{{ end }}
